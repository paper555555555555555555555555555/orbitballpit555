const PPM = 40, PLAYER_SIZE = 80, NUM_ORBS = 11, VH = 1080, STEP = 1 / 60;
const pl = planck, Vec2 = pl.Vec2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw, ch, dpr, VW, rs;      // canvas px, device ratio, virtual width, render scale (virtual height is always 1080)

const imgs = SPRITES.map(src => { const im = new Image(); im.src = src; return im; });
const rnd = () => Math.random();

/* ---------- world ---------- */
let world, ground, floorBody, cursorBody, cursorFix, joint = null;
let walls = [], balls = [], st;

function addWall(x1, y1, x2, y2) {
  const b = world.createBody();
  b.createFixture(pl.Edge(Vec2(x1 / PPM, y1 / PPM), Vec2(x2 / PPM, y2 / PPM)),
                  { restitution: CFG.bounce, friction: 0.7 });
  walls.push(b);
  return b;
}

function cursorRadius() { return 85 * CFG.mouseStrength / PPM; }
function makeCursorFixture() {
  if (cursorFix) cursorBody.destroyFixture(cursorFix);
  cursorFix = cursorBody.createFixture(pl.Circle(cursorRadius()), { friction: 0.3, restitution: 0.4 });
}

function reset() {
  joint = null; mouse.grab = null;
  world = new pl.World({ gravity: Vec2(0, 9.8 * 3 * CFG.gravity) });
  ground = world.createBody();
  walls = []; balls = [];
  addWall(0, 0, 0, VH);
  addWall(VW, 0, VW, VH);
  floorBody = addWall(0, VH, VW, VH);
  cursorBody = world.createBody({ type: 'kinematic', position: Vec2(-1000, -1000) });
  cursorFix = null; makeCursorFixture();
  st = { acc: 1, nextSpawn: 0, cubeDone: false, t: 0, doneAt: 0, delay: 0, draining: false, drainT: 0 };
}

function spawnOrb() {
  const r = (40 + Math.floor(rnd() * 20)) * CFG.orbScale;
  const idx = Math.floor(rnd() * NUM_ORBS);
  const x = r + rnd() * (VW - 2 * r);
  const body = world.createBody({ type: 'dynamic', position: Vec2(x / PPM, -250 / PPM), angle: rnd() * Math.PI * 2 });
  const shape = idx === 10 ? pl.Box(r / PPM, r / PPM) : pl.Circle(r / PPM);   // orb11 is the square one
  body.createFixture(shape, { density: 1, restitution: CFG.bounce, friction: 1 });
  body.applyLinearImpulse(Vec2((10 - Math.floor(rnd() * 21)) * 0.05, 0), body.getWorldCenter(), true);
  balls.push({ body, r, idx, cube: false, scale: CFG.orbScale });
}

function spawnCube() {
  const s = PLAYER_SIZE * CFG.orbScale, im = imgs[0];
  const tw = im.naturalWidth || 1, th = im.naturalHeight || 1, mx = Math.max(tw, th);
  const w = s * tw / mx, h = s * th / mx;
  const body = world.createBody({
    type: 'dynamic',
    position: Vec2(rnd() * VW / PPM, -(200 + rnd() * 800) / PPM),
    angle: rnd() * Math.PI * 2
  });
  body.createFixture(pl.Box(w * 0.5 / PPM, h * 0.5 / PPM), { density: 1, restitution: CFG.bounce, friction: 0.7 });
  balls.push({ body, r: s * 0.5, idx: -1, cube: true, w, h, scale: CFG.orbScale });
}

function applyScale() {
  for (const b of balls) {
    const k = CFG.orbScale / b.scale;
    if (Math.abs(k - 1) < 1e-6) continue;
    b.scale = CFG.orbScale;
    let f;
    while ((f = b.body.getFixtureList())) b.body.destroyFixture(f);
    if (b.cube) {
      b.w *= k; b.h *= k; b.r *= k;
      b.body.createFixture(pl.Box(b.w * 0.5 / PPM, b.h * 0.5 / PPM), { density: 1, restitution: CFG.bounce, friction: 0.7 });
    } else {
      b.r *= k;
      const shape = b.idx === 10 ? pl.Box(b.r / PPM, b.r / PPM) : pl.Circle(b.r / PPM);
      b.body.createFixture(shape, { density: 1, restitution: CFG.bounce, friction: 1 });
    }
    b.body.setAwake(true);
  }
}

function startDrain() {
  if (floorBody) { world.destroyBody(floorBody); walls = walls.filter(w => w !== floorBody); floorBody = null; }
  for (const b of balls) b.body.setAwake(true);
  st.draining = true; st.drainT = 0;
}

function pileFull() {
  const line = VH * CFG.fillLine;
  let n = 0;
  for (const b of balls) {
    const p = b.body.getPosition(), y = p.y * PPM;
    if (y > 0 && y - b.r < line && b.body.getLinearVelocity().length() < 2) n++;
  }
  return n >= 3;
}

/* fill -> (wait) -> floor disappears -> everything falls out -> start again */
function logic(dt) {
  st.t += dt;
  if (!st.draining) {
    st.acc += dt * CFG.spawnPerSec;
    while (st.acc >= 1 && st.nextSpawn < CFG.orbCount) { st.acc -= 1; spawnOrb(); st.nextSpawn++; }
    if (st.nextSpawn >= CFG.orbCount) st.acc = 0;
    if (!st.cubeDone && st.nextSpawn >= CFG.orbCount / 2) { st.cubeDone = true; spawnCube(); }  // one cube per fill

    if (st.nextSpawn >= CFG.orbCount) {
      if (!st.doneAt) { st.doneAt = st.t; st.delay = 5 + rnd(); }     // original waits 5-6 s
      if (st.t - st.doneAt >= st.delay) startDrain();
    } else if (pileFull()) {
      startDrain();                                                    // pit is full early: stop spawning and drop
    }
  } else {
    st.drainT += dt;
    let allOff = true;
    for (const b of balls) if (b.body.getPosition().y * PPM < VH + 300) { allOff = false; break; }
    if (allOff || st.drainT > 25) reset();
  }
}

/* ---------- mouse ---------- */
const mouse = { x: 0, y: 0, on: false, grab: null };   // x,y in virtual px
function setMouse(e) { mouse.x = e.clientX * dpr / rs; mouse.y = e.clientY * dpr / rs; mouse.on = true; }
addEventListener('mousemove', setMouse);
addEventListener('mousedown', e => {
  if (!CFG.mouseForce || !world) return;
  setMouse(e);
  const p = Vec2(mouse.x / PPM, mouse.y / PPM);
  for (let i = balls.length - 1; CFG.mouseMode !== 0 && i >= 0; i--) {   // grab the top-most orb under the cursor
    const b = balls[i];
    if (b.body.getFixtureList().testPoint(p)) {
      b.body.setAwake(true);
      joint = world.createJoint(pl.MouseJoint(
        { maxForce: 1000 * b.body.getMass(), frequencyHz: 5, dampingRatio: 0.9 }, ground, b.body, p));
      mouse.grab = b;
      return;
    }
  }
  if (CFG.mouseMode === 1) return;                                // grab-only mode: no blast
  const R = 320 * CFG.mouseStrength / PPM;                        // click: blast nearby orbs away
  for (const b of balls) {
    const c = b.body.getPosition(), dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy);
    if (d < R && d > 0.01) {
      const dv = (1 - d / R) * 30 * CFG.mouseStrength;
      b.body.applyLinearImpulse(Vec2(dx / d * dv * b.body.getMass(), dy / d * dv * b.body.getMass()), b.body.getWorldCenter(), true);
    }
  }
});
function release() { if (joint) { try { world.destroyJoint(joint); } catch (e) {} joint = null; } mouse.grab = null; }
addEventListener('mouseup', release);
addEventListener('blur', () => { release(); mouse.on = false; });
document.addEventListener('mouseleave', () => { release(); mouse.on = false; });

function updateMouse() {
  const p = Vec2(mouse.x / PPM, mouse.y / PPM);
  if (joint) joint.setTarget(p);
  // the cursor is a kinematic circle that sweeps through the pile; parked off-screen when unused
  if (CFG.mouseForce && CFG.mouseMode !== 1 && mouse.on && !joint) {
    const cur = cursorBody.getPosition();
    if (cur.x < -500 / PPM) { cursorBody.setPosition(p); cursorBody.setLinearVelocity(Vec2(0, 0)); }
    else {
      let vx = (p.x - cur.x) / STEP, vy = (p.y - cur.y) / STEP;
      const m = 30, s = Math.hypot(vx, vy);
      if (s > m) { vx *= m / s; vy *= m / s; }
      cursorBody.setLinearVelocity(Vec2(vx, vy));
    }
  } else {
    cursorBody.setPosition(Vec2(-1000, -1000)); cursorBody.setLinearVelocity(Vec2(0, 0));
  }
}

/* ---------- sizing ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = canvas.width = Math.floor(innerWidth * dpr);
  ch = canvas.height = Math.floor(innerHeight * dpr);
  rs = ch / VH;
  VW = VH * cw / ch;
  reset();                                   // walls depend on the width
}
addEventListener('resize', resize);
resize();

/* ---------- main loop ---------- */
let last = performance.now(), accT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  logic(dt);
  accT += dt;
  let n = 0;
  while (accT >= STEP && n < 5) { updateMouse(); world.step(STEP, 8, 3); accT -= STEP; n++; }
  if (n === 5) accT = 0;
  draw();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(rs, 0, 0, rs, 0, 0);
  for (const b of balls) {
    const p = b.body.getPosition(), x = p.x * PPM, y = p.y * PPM;
    if (y < -150 || y > VH + 250) continue;
    const im = b.cube ? imgs[0] : imgs[b.idx + 1];
    if (!im.complete || !im.naturalWidth) continue;
    let w, h;
    if (b.cube) { w = b.w; h = b.h; }
    else { const d = b.r * 2, mx = Math.max(im.naturalWidth, im.naturalHeight); w = d * im.naturalWidth / mx; h = d * im.naturalHeight / mx; }
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(b.body.getAngle());
    ctx.drawImage(im, -w / 2, -h / 2, w, h);
    ctx.restore();
  }
}
requestAnimationFrame(frame);

/* ---------- Lively Wallpaper properties ---------- */
window.livelyPropertyListener = function (name, val) {
  if (name === 'mouseForce') { CFG.mouseForce = (val === true || val === 'true'); if (!CFG.mouseForce) release(); return; }
  if (name === 'mouseMode') {
    const s = String(val).toLowerCase();
    CFG.mouseMode = s.indexOf('both') >= 0 ? 2 : s.indexOf('grab') >= 0 ? 1 : s.indexOf('bump') >= 0 ? 0 : (Number(val) | 0);
    if (CFG.mouseMode === 0) release();
    return;
  }
  const n = Number(val);
  if (!isFinite(n) || !(name in CFG)) return;
  CFG[name] = (name === 'orbScale') ? Math.max(0.3, Math.min(3, n)) : n;
  if (!world) return;
  if (name === 'orbScale') applyScale();
  if (name === 'gravity') { world.setGravity(Vec2(0, 9.8 * 3 * n)); for (const b of balls) b.body.setAwake(true); }
  if (name === 'bounce') {
    for (const w of walls) for (let f = w.getFixtureList(); f; f = f.getNext()) f.setRestitution(n);
    for (const b of balls) for (let f = b.body.getFixtureList(); f; f = f.getNext()) f.setRestitution(n);
  }
  if (name === 'mouseStrength') makeCursorFixture();
};
</script>
